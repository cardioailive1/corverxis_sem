services:
  - type: web
    name: sem-osc-backend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    # Mirrors NexGen Lab's proven, working build command sequence:
    # npm install first, then prisma generate, then prisma db push with
    # --accept-data-loss (confirmed working across tonight's real deploys).
    # The one deliberate difference: --schema=./schema.prisma is explicit
    # here because this repo keeps schema.prisma directly in backend/,
    # not in a backend/prisma/ subfolder the way NexGen Lab's layout does —
    # Prisma's default lookup wouldn't find it otherwise.
    buildCommand: npm install && npx prisma generate --schema=./schema.prisma && npx prisma db push --schema=./schema.prisma --accept-data-loss
    # Matches NexGen Lab's actual confirmed start command exactly (seen
    # directly in its real deploy logs: "Running 'node server.js'"), not
    # the npm-start indirection.
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sem-osc-db
          property: connectionString
      # Genuinely needed now — the Skill Compiler's real log-modality
      # pipeline (backend/compiler/logPipeline.js) calls Claude directly
      # for stages 2-4 (extraction, verification, abstraction).
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Product API (customer-facing, /api/product/*) ──────────────────
      # Comma-separated access keys. Without it the product API refuses to
      # serve in production. Give each customer their own key.
      - key: SEM_PRODUCT_API_KEYS
        sync: false
      # Where the trained SEM model is served. Without it (or without an
      # ACTIVE checkpoint) the product falls back to a clearly labelled general
      # model, or returns 503 if SEM_PRODUCT_ALLOW_FALLBACK=false.
      # SEM_INFERENCE_KIND: openai (vLLM, default) | hf | runpod
      - key: SEM_INFERENCE_URL
        sync: false
      - key: SEM_INFERENCE_KIND
        value: openai
      - key: SEM_INFERENCE_API_KEY
        sync: false
      - key: SEM_PRODUCT_ALLOW_FALLBACK
        value: "true"
      # Optional. Without these, demonstration files are stored on local
      # disk only, which does NOT survive a redeploy — every code push
      # wipes previously uploaded files (this is what caused a real ENOENT
      # error during development). Set all three to fix this properly.
      # - key: S3_BUCKET
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false

  # Customer-facing product UI — separate static site from the Lab UI
  # (which the backend serves from /frontend). Set product/config.js
  # SEM_API_BASE to the backend URL before deploying.
  - type: web
    name: sem-product-ui
    runtime: static
    branch: main
    staticPublishPath: ./product
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: sem-osc-db
    plan: basic-256mb
    region: oregon
