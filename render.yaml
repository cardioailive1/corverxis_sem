services:
  - type: web
    name: sem-osc-backend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    # Mirrors NexGen Lab's proven, working build command sequence:
    # npm install first, then prisma generate, then prisma db push with
    # --accept-data-loss (confirmed working across tonight's real deploys).
    # The one deliberate difference: --schema=./schema.prisma is explicit
    # here because this repo keeps schema.prisma directly in backend/,
    # not in a backend/prisma/ subfolder the way NexGen Lab's layout does —
    # Prisma's default lookup wouldn't find it otherwise.
    buildCommand: npm install && npx prisma generate --schema=./schema.prisma && npx prisma db push --schema=./schema.prisma --accept-data-loss
    # Matches NexGen Lab's actual confirmed start command exactly (seen
    # directly in its real deploy logs: "Running 'node server.js'"), not
    # the npm-start indirection.
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sem-osc-db
          property: connectionString
      # Genuinely needed now — the Skill Compiler's real log-modality
      # pipeline (backend/compiler/logPipeline.js) calls Claude directly
      # for stages 2-4 (extraction, verification, abstraction).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional. Without these, demonstration files are stored on local
      # disk only, which does NOT survive a redeploy — every code push
      # wipes previously uploaded files (this is what caused a real ENOENT
      # error during development). Set all three to fix this properly.
      # - key: S3_BUCKET
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false

databases:
  - name: sem-osc-db
    plan: basic-256mb
    region: oregon
