<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SEM+OSC</title>
<style>
  :root { --bg:#021830; --panel:#072544; --panel2:#0d2f52; --border:#16466e; --text:#ffffff; --text2:#5c8aa8; --text3:#3d6484; --cyan:#05d2fc; --green:#4ade80; --red:#f87171; --yellow:#fbbf24; --mono:'JetBrains Mono',monospace; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); margin:0; }
  #app { display:flex; min-height:100vh; }
  nav { width:220px; border-right:1px solid var(--border); padding:16px; flex-shrink:0; }
  nav .logo-img { width:100%; border-radius:6px; margin-bottom:6px; display:block; }
  nav .logo { font-size:11px; font-weight:700; color:var(--cyan); margin-bottom:20px; letter-spacing:.08em; }
  nav .nav-item { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:11px; color:var(--text2); margin-bottom:2px; display:flex; justify-content:space-between; }
  nav .nav-item.active { background:rgba(0,207,255,.08); color:var(--cyan); }
  nav .nav-item .badge-count { font-size:9px; color:var(--text3); }
  main { flex:1; padding:24px; max-width:1200px; }
  .card { border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; background:var(--panel); }
  .card-label { font-size:10px; color:var(--text3); letter-spacing:.05em; margin-bottom:10px; }
  .mod-header { font-size:9px; color:var(--text3); letter-spacing:.08em; }
  .mod-title { font-size:16px; font-weight:700; margin:2px 0 16px 0; }
  select, input, textarea { width:100%; padding:6px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; font-family:var(--mono); font-size:11px; outline:none; }
  .btn { padding:6px 14px; border-radius:5px; border:1px solid var(--border); background:var(--panel); color:var(--text2); font-family:var(--mono); font-size:10px; cursor:pointer; }
  .btn-cyan { background:rgba(0,207,255,.1); border-color:var(--cyan); color:var(--cyan); }
  .btn-full { width:100%; }
  .badge { font-size:8px; padding:2px 8px; border-radius:10px; }
  .badge-sem { background:rgba(251,191,36,.12); color:var(--yellow); }
  .badge-compiler { background:rgba(0,207,255,.12); color:var(--cyan); }
  .stage-row { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
  .stage-pill { padding:3px 10px; border-radius:10px; font-size:8px; border:1px solid var(--border); color:var(--text3); }
  .stage-pill.done { background:rgba(74,222,128,.12); color:var(--green); border-color:var(--green); }
  .stage-pill.active { background:rgba(0,207,255,.12); color:var(--cyan); border-color:var(--cyan); animation:pulse 1.5s infinite; }
  .stage-pill.failed { background:rgba(248,113,113,.12); color:var(--red); border-color:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:9px; color:var(--text3); margin-bottom:4px; }
  .row-clickable { cursor:pointer; transition:background .1s; }
  .row-clickable:hover { background:var(--panel2); }
  .progress-track { width:100%; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; margin:8px 0; }
  .progress-fill { height:100%; background:var(--cyan); transition:width .3s; }
  .detail-json { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; font-size:9px; color:var(--text2); white-space:pre-wrap; word-break:break-all; max-height:240px; overflow-y:auto; }
  .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:6px; animation:pulse 1.2s infinite; }
  .chip { display:inline-block; padding:3px 9px; border-radius:10px; font-size:9px; border:1px solid var(--border); color:var(--text3); cursor:pointer; margin:0 6px 6px 0; }
  .chip.active { background:rgba(0,207,255,.12); color:var(--cyan); border-color:var(--cyan); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.origin;
const state = {
  module: 'usecases', useCases: null, scenarios: [], demos: [], trainingRuns: [], compilerJobs: [], checkpoints: null,
  selectedUseCase: null, error: null, busy: false,
  _scenarioFilter: '', _demoFilter: '', _expandedScenario: null, _expandedJob: null,
  _compileFormFor: null, _runDetail: null, _runDetailResults: null,
};
let _pollHandle = null;

function dc(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'className') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === undefined || c === null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function card(...children) { return dc('div', { className: 'card' }, ...children); }
function btn(label, cls, onClick, disabled) {
  return dc('button', { className: 'btn ' + (cls || ''), onClick, disabled: !!disabled }, label);
}
function field(labelText, inputEl) {
  return dc('div', { className: 'field' }, dc('label', {}, labelText), inputEl);
}
function modHeader(kicker, title) {
  return dc('div', {}, dc('div', { className: 'mod-header' }, kicker), dc('div', { className: 'mod-title' }, title));
}

// ── Small, dependency-free SVG bar chart — no CDN, no external library ────
function svgBarChart(values, labels, opts) {
  opts = opts || {};
  const w = opts.width || 480, h = opts.height || 140, pad = 24;
  const max = Math.max(1, ...values);
  const barW = (w - pad * 2) / values.length * 0.7;
  const gap = (w - pad * 2) / values.length;
  let bars = '';
  values.forEach((v, i) => {
    const barH = (v / max) * (h - pad * 2);
    const x = pad + i * gap + (gap - barW) / 2;
    const y = h - pad - barH;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="#05d2fc" opacity="0.85" rx="2"/>';
    bars += '<text x="' + (x + barW / 2) + '" y="' + (h - pad + 12) + '" font-size="8" fill="#3d6484" text-anchor="middle" font-family="monospace">' + (labels[i] || '') + '</text>';
    bars += '<text x="' + (x + barW / 2) + '" y="' + (y - 4) + '" font-size="8" fill="#5c8aa8" text-anchor="middle" font-family="monospace">' + v + '</text>';
  });
  const svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' + bars + '</svg>';
  const wrap = dc('div', {});
  wrap.innerHTML = svg;
  return wrap;
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// ── Polling — one active poll at a time, tied to the current module, so
// navigating away stops it rather than silently polling a tab you left. ────
function stopPolling() { if (_pollHandle) { clearInterval(_pollHandle); _pollHandle = null; } }
function startPolling(fn, ms) { stopPolling(); _pollHandle = setInterval(fn, ms); }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const nav = dc('nav', {},
    dc('img', { className: 'logo-img', src: 'assets/corverxis_logo.jpg', alt: 'Corverxis Technologies' }),
    dc('div', { className: 'logo' }, 'SEM+OSC'),
    ...[
      ['usecases', 'Use Cases', null],
      ['scenarios', 'Scenarios (SEM)', state.scenarios.length],
      ['demonstrations', 'Demonstrations', state.demos.length],
      ['training', 'Training Runs', state.trainingRuns.length],
      ['compiler', 'Compiler Jobs', state.compilerJobs.length],
      ['checkpoints', 'Checkpoints', state.checkpoints ? state.checkpoints.length : null],
    ].map(([id, label, count]) => dc('div', {
      className: 'nav-item' + (state.module === id ? ' active' : ''),
      onClick: () => { state.module = id; stopPolling(); render(); },
    }, dc('span', {}, label), count != null ? dc('span', { className: 'badge-count' }, String(count)) : ''))
  );
  const main = dc('main', {});
  const renderers = {
    usecases: renderUseCases, scenarios: renderScenarios, demonstrations: renderDemonstrations,
    training: renderTraining, compiler: renderCompiler, checkpoints: renderCheckpoints,
  };
  main.append((renderers[state.module] || renderUseCases)());
  app.append(nav, main);
}

// ── Use Cases — with live, cross-referenced counts and search ─────────────
function renderUseCases() {
  if (state.useCases === null) { state.useCases = []; loadUseCases(); }
  if (!state._ucLoadedRest) { state._ucLoadedRest = true; loadScenarios(); loadDemonstrations(); loadCompilerJobs(); }
  if (state._ucSearch === undefined) state._ucSearch = '';

  const container = dc('div', {});
  container.append(modHeader('SEM+OSC', 'Use Cases'));

  const search = field('SEARCH', dc('input', {
    value: state._ucSearch, placeholder: 'Filter by name…',
    oninput: e => { state._ucSearch = e.target.value; render(); },
  }));

  const matches = u => u.name.toLowerCase().includes(state._ucSearch.toLowerCase()) || u.description.toLowerCase().includes(state._ucSearch.toLowerCase());
  const semCases = state.useCases.filter(u => u.kind === 'sem_only' && matches(u));
  const compilerCases = state.useCases.filter(u => u.kind === 'compiler' && matches(u));

  const renderCase = u => {
    const expanded = state.selectedUseCase === u.id;
    const scenarioCount = state.scenarios.filter(s => s.use_case_id === u.id).length;
    const demoCount = state.demos.filter(d => d.use_case_id === u.id).length;
    const jobCount = state.compilerJobs.filter(j => j.use_case_id === u.id).length;
    return dc('div', {
      className: 'row-clickable', style: 'padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px',
      onClick: () => { state.selectedUseCase = expanded ? null : u.id; render(); },
    },
      dc('div', {}, dc('span', { className: 'badge ' + (u.kind === 'sem_only' ? 'badge-sem' : 'badge-compiler') }, u.kind === 'sem_only' ? 'SEM' : 'COMPILER'), ' ', dc('b', {}, u.name)),
      dc('div', { style: 'color:var(--text3);font-size:10px;margin-top:4px' }, u.description),
      expanded && dc('div', { style: 'margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:9px;color:var(--text2)' },
        u.kind === 'sem_only'
          ? dc('div', {}, scenarioCount + ' scenario(s) generated')
          : dc('div', {}, demoCount + ' demonstration(s) uploaded · ' + jobCount + ' compiler job(s) created'),
        u.kind === 'compiler' && dc('div', { style: 'margin-top:4px;color:var(--text3)' }, 'Output targets: ' + u.output_targets.join(', '))
      )
    );
  };

  container.append(card(dc('div', { className: 'card-label' }, 'SEM-ONLY — STANDALONE DIAGNOSTIC USE CASES'), search, ...semCases.map(renderCase)));
  container.append(card(dc('div', { className: 'card-label' }, 'COMPILER USE CASES — DEMONSTRATION → REUSABLE SKILL'), ...compilerCases.map(renderCase)));
  return container;
}
async function loadUseCases() { try { state.useCases = await api('GET', '/api/use-cases'); render(); } catch (e) { console.error(e); } }

// ── Scenarios — filter, chart, expandable detail, live refresh ────────────
function renderScenarios() {
  if (!state.useCases) { state.useCases = []; loadUseCases(); }
  if (!state._scenariosPolling) { state._scenariosPolling = true; startPolling(loadScenarios, 5000); }

  const container = dc('div', {});
  container.append(modHeader('SEM TRAINING DATA', 'Scenarios'));
  const semCases = (state.useCases || []).filter(u => u.kind === 'sem_only');

  container.append(card(
    dc('div', { className: 'card-label' }, 'GENERATE SCENARIOS'),
    field('USE CASE', (() => {
      const el = dc('select', { id: 'fld-scenario-usecase' });
      semCases.forEach(u => el.append(dc('option', { value: u.id }, u.name)));
      return el;
    })()),
    field('COUNT', dc('input', { type: 'number', id: 'fld-scenario-count', value: '10' })),
    btn(state.busy ? '⟳ Generating…' : '⚡ Generate', 'btn-cyan btn-full', generateScenarios, state.busy)
  ));

  const filtered = state._scenarioFilter ? state.scenarios.filter(s => s.use_case_id === state._scenarioFilter) : state.scenarios;

  if (semCases.length > 0) {
    const counts = semCases.map(u => state.scenarios.filter(s => s.use_case_id === u.id).length);
    container.append(card(
      dc('div', { className: 'card-label' }, 'SCENARIOS PER USE CASE'),
      svgBarChart(counts, semCases.map(u => u.name.split(' ')[0]))
    ));
  }

  container.append(card(
    dc('div', { className: 'card-label' }, dc('span', { className: 'live-dot' }), 'SCENARIOS (' + filtered.length + ')'),
    dc('div', { style: 'margin-bottom:10px' },
      dc('span', { className: 'chip' + (state._scenarioFilter === '' ? ' active' : ''), onClick: () => { state._scenarioFilter = ''; render(); } }, 'All'),
      ...semCases.map(u => dc('span', { className: 'chip' + (state._scenarioFilter === u.id ? ' active' : ''), onClick: () => { state._scenarioFilter = u.id; render(); } }, u.name))
    ),
    filtered.length === 0 ? dc('div', { style: 'color:var(--text3);font-size:10px' }, 'None yet.') :
    dc('div', {}, ...filtered.slice(0, 30).map((s, i) => {
      const expanded = state._expandedScenario === s.id;
      return dc('div', {
        className: 'row-clickable', style: 'padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:9px',
        onClick: () => { state._expandedScenario = expanded ? null : s.id; render(); },
      },
        dc('div', {}, 'true: ', dc('b', {}, JSON.stringify(s.hidden_intervention))),
        dc('div', { style: 'color:var(--text3)' }, 'observed: ', JSON.stringify(s.observations)),
        expanded && dc('div', { className: 'detail-json', style: 'margin-top:8px' }, JSON.stringify(s, null, 2))
      );
    }))
  ));
  return container;
}
async function generateScenarios() {
  const use_case_id = document.getElementById('fld-scenario-usecase')?.value;
  const count = parseInt(document.getElementById('fld-scenario-count')?.value || '10');
  if (!use_case_id) return;
  state.busy = true; render();
  try {
    const created = await api('POST', '/api/scenarios/generate', { use_case_id, count });
    state.scenarios = [...created, ...state.scenarios];
  } catch (e) { alert(e.message); }
  state.busy = false; render();
}
async function loadScenarios() { try { state.scenarios = await api('GET', '/api/scenarios'); render(); } catch (e) { console.error(e); } }

// ── Demonstrations — filter, and the real fix: a working Compile action ───
function renderDemonstrations() {
  if (!state.useCases) { state.useCases = []; loadUseCases(); }
  if (!state._demosPolling) { state._demosPolling = true; startPolling(loadDemonstrations, 5000); }
  if (!state._demosLoadedJobs) { state._demosLoadedJobs = true; loadCompilerJobs(); }

  const container = dc('div', {});
  container.append(modHeader('COMPILER INPUT', 'Demonstrations'));
  const compilerCases = (state.useCases || []).filter(u => u.kind === 'compiler');

  container.append(card(
    dc('div', { className: 'card-label' }, 'UPLOAD DEMONSTRATION'),
    dc('div', { style: 'font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:12px;line-height:1.6;padding:8px;border:1px solid var(--border);border-radius:6px' },
      dc('b', { style: 'color:var(--yellow)' }, '"log", "screen_recording", and "video" modalities all have real, working pipelines now.'),
      ' motion_capture still completes with a placeholder note — robot-targeted output specifically needs a real trained SEM checkpoint for verification before it should drive physical hardware, not the current Claude-based stand-in. A log demonstration is a JSON file: an array of ',
      dc('code', { style: 'color:var(--cyan)' }, '{"action": "...", "target": "...", "value": "..."}'),
      ' steps. screen_recording and video demonstrations are real video files — processed by extracting frames and inferring the action between each consecutive pair (UI actions for screen_recording, physical actions like pick-up/place/assemble for video). ',
      dc('span', { style: 'color:var(--cyan);cursor:pointer;text-decoration:underline', onClick: downloadSampleLogFile }, 'Download a sample log file'),
      ' to try it.'
    ),
    field('USE CASE', (() => {
      const el = dc('select', { id: 'fld-demo-usecase' });
      compilerCases.forEach(u => el.append(dc('option', { value: u.id }, u.name)));
      return el;
    })()),
    field('MODALITY', (() => {
      const el = dc('select', { id: 'fld-demo-modality' });
      [['log', 'log — real pipeline'], ['screen_recording', 'screen_recording — real pipeline'], ['video', 'video — real pipeline'], ['motion_capture', 'motion_capture — placeholder']]
        .forEach(([value, label]) => el.append(dc('option', { value }, label)));
      return el;
    })()),
    field('FILE', dc('input', {
      type: 'file', id: 'fld-demo-file',
      // Captures the actual File object into app state immediately on
      // selection — a re-render (this tab polls every 5s) rebuilds the
      // whole DOM including this input, and unlike text fields, a file
      // input's selection cannot be restored via JS at all once that
      // happens. Reading from state at upload time, not re-querying this
      // element, is what makes the selection survive.
      onchange: e => { state._demoSelectedFile = e.target.files?.[0] || null; render(); },
    })),
    state._demoSelectedFile && dc('div', { style: 'font-size:9px;color:var(--cyan);margin:-6px 0 10px 0' },
      '✓ ' + state._demoSelectedFile.name + ' selected'),
    btn(state.busy ? '⟳ Uploading…' : '⬆ Upload', 'btn-cyan btn-full', uploadDemonstration, state.busy)
  ));

  const filtered = state._demoFilter ? state.demos.filter(d => d.use_case_id === state._demoFilter) : state.demos;

  container.append(card(
    dc('div', { className: 'card-label' }, dc('span', { className: 'live-dot' }), 'DEMONSTRATIONS (' + filtered.length + ')'),
    dc('div', { style: 'margin-bottom:10px' },
      dc('span', { className: 'chip' + (state._demoFilter === '' ? ' active' : ''), onClick: () => { state._demoFilter = ''; render(); } }, 'All'),
      ...compilerCases.map(u => dc('span', { className: 'chip' + (state._demoFilter === u.id ? ' active' : ''), onClick: () => { state._demoFilter = u.id; render(); } }, u.name))
    ),
    filtered.length === 0 ? dc('div', { style: 'color:var(--text3);font-size:10px' }, 'None yet.') :
    dc('div', {}, ...filtered.map(d => {
      const useCase = compilerCases.find(u => u.id === d.use_case_id);
      const showingCompileForm = state._compileFormFor === d.id;
      const isReal = d.modality === 'log' || d.modality === 'screen_recording' || d.modality === 'video';
      // A demonstration whose file is confirmed gone (from a prior failed
      // compile) is flagged directly here — retrying Compile on it will
      // always fail the same way, so this needs to be obvious before
      // someone burns another attempt on it, not just visible buried in
      // a job's error message on a different tab.
      const fileGone = (state.compilerJobs || []).some(j =>
        j.demonstration_id === d.id && j.stage === 'failed' && (j.error_message || '').includes('no longer available')
      );
      return dc('div', { style: 'padding:10px;border:1px solid ' + (fileGone ? 'var(--red)' : 'var(--border)') + ';border-radius:6px;margin-bottom:8px' },
        dc('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
          dc('div', { style: 'font-size:10px' },
            d.original_name + ' · ' + d.modality + ' ',
            dc('span', { className: 'badge ' + (isReal ? 'badge-sem' : ''), style: isReal ? '' : 'background:rgba(113,113,122,.15);color:var(--text3)' }, isReal ? 'REAL' : 'PLACEHOLDER')
          ),
          btn('Compile', 'btn-cyan', () => { state._compileFormFor = showingCompileForm ? null : d.id; render(); })
        ),
        fileGone && dc('div', { style: 'margin-top:8px;font-size:9px;color:var(--red)' },
          '⚠ This file is no longer available on the server — Compile will fail again. Upload a fresh copy above to get a new, working demonstration instead of retrying this one.'
        ),
        showingCompileForm && useCase && dc('div', { style: 'margin-top:10px;padding-top:10px;border-top:1px solid var(--border)' },
          field('OUTPUT TARGET', (() => {
            const el = dc('select', { id: 'fld-compile-target-' + d.id });
            useCase.output_targets.forEach(t => el.append(dc('option', { value: t }, t)));
            return el;
          })()),
          btn(state.busy ? '⟳ Starting…' : '▶ Start Compilation', 'btn-cyan btn-full', () => startCompilerJob(d.id, d.use_case_id), state.busy)
        )
      );
    }))
  ));
  return container;
}
function downloadSampleLogFile() {
  const sample = [
    { action: 'click', target: 'login_button' },
    { action: 'type', target: 'username_field', value: 'jsmith' },
    { action: 'type', target: 'password_field', value: 'hunter2' },
    { action: 'click', target: 'submit_button' },
  ];
  const blob = new Blob([JSON.stringify(sample, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sample-demonstration-log.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function uploadDemonstration() {
  const file = state._demoSelectedFile;
  const use_case_id = document.getElementById('fld-demo-usecase')?.value;
  const modality = document.getElementById('fld-demo-modality')?.value;
  if (!file || !use_case_id) return;
  state.busy = true; render();
  try {
    const formData = new FormData();
    formData.append('file', file); formData.append('use_case_id', use_case_id); formData.append('modality', modality);
    const resp = await fetch(API + '/api/demonstrations/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    if (data.healed) {
      // Updates an existing record in place — replace it, don't prepend
      // a duplicate row for what's actually the same demonstration id.
      state.demos = state.demos.map(d => d.id === data.id ? data : d);
      alert('This file was already uploaded, but its stored copy was missing — re-linked the existing demonstration to this fresh upload instead of creating a duplicate. Compiler Jobs tied to it should now work again.');
    } else {
      state.demos = [data, ...state.demos];
    }
    state._demoSelectedFile = null;   // clear only on genuine success — a failed upload keeps the file selected so the user doesn't have to re-pick it to retry
  } catch (e) { alert(e.message); }
  state.busy = false; render();
}
async function loadDemonstrations() { try { state.demos = await api('GET', '/api/demonstrations'); render(); } catch (e) { console.error(e); } }

async function startCompilerJob(demonstration_id, use_case_id) {
  const target_output = document.getElementById('fld-compile-target-' + demonstration_id)?.value;
  state.busy = true; render();
  try {
    const job = await api('POST', '/api/compiler-jobs', { use_case_id, demonstration_id, target_output });
    state.compilerJobs = [job, ...state.compilerJobs];
    state._compileFormFor = null;
    state.module = 'compiler';
  } catch (e) { alert(e.message); }
  state.busy = false; render();
}

// ── Training Runs — progress bar, live poll, detail with reward chart ─────
function renderTraining() {
  if (!state.useCases) { state.useCases = []; loadUseCases(); }
  if (!state.scenarios || state.scenarios.length === 0) { loadScenarios(); }
  if (!state._trainingPolling) {
    state._trainingPolling = true;
    startPolling(async () => {
      await loadTrainingRuns();
      if (state._runDetail) await loadRunDetail(state._runDetail);
    }, 4000);
  }

  const container = dc('div', {});
  container.append(modHeader('SEM MODEL TRAINING', 'Training Runs'));

  // ── Data pipeline — real visibility into what actually feeds training,
  // not just a button that starts something opaque. Reuses scenario data
  // already loaded elsewhere, no new backend call needed. ─────────────────
  const semCases = (state.useCases || []).filter(u => u.kind === 'sem_only');
  const domainCounts = semCases.map(u => ({
    name: u.name, count: (state.scenarios || []).filter(s => s.use_case_id === u.id).length,
  }));
  const totalScenarios = domainCounts.reduce((sum, d) => sum + d.count, 0);
  container.append(card(
    dc('div', { className: 'card-label' }, 'COLLECTED EXAMPLE SCENARIOS'),
    dc('div', { style: 'font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:10px;line-height:1.6' },
      totalScenarios + ' scenarios stored in the database, generated on the Scenarios tab — for browsing real examples and running Reference checks below. ',
      dc('b', {style:'color:var(--yellow)'}, 'Real GRPO training does not read from here.')),
    domainCounts.length > 0 ? svgBarChart(domainCounts.map(d => d.count), domainCounts.map(d => d.name.split(' ')[0])) :
      dc('div', { style: 'color:var(--text3);font-size:10px' }, 'No scenarios generated yet — visit the Scenarios tab.')
  ));

  container.append(card(
    dc('div', { className: 'card-label' }, 'THE ACTUAL GRPO DATA PIPELINE'),
    dc('div', { style: 'font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.7' },
      'Lives entirely in code, not this database. ',
      dc('code', {style:'color:var(--cyan)'}, 'training/grpo/dataset.py'),
      ' calls the 6 simulator modules directly and generates fresh synthetic scenarios in memory, at training time, feeding straight into ',
      dc('code', {style:'color:var(--cyan)'}, 'GRPOTrainer'),
      ' — no collection or storage step, since synthetic scenarios are cheap to regenerate on demand rather than needing to be saved and read back. The card above is a separate, parallel thing: real, useful, but not part of this path.')
  ));

  container.append(card(
    dc('div', { className: 'card-label' }, 'REFERENCE RUN — FAST, IN-PROCESS MECHANISM CHECK'),
    dc('div', { style: 'font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:10px;line-height:1.6' },
      'Runs the heuristic proposer against existing scenarios, right here in the backend, in seconds. Useful for confirming the reward mechanism works — this is NOT real model training, no weights are updated.'),
    btn(state.busy ? '⟳ Starting…' : '▶ Start Reference Run', 'btn-cyan btn-full', startTrainingRun, state.busy)
  ));

  container.append(card(
    dc('div', { className: 'card-label' }, 'REAL GRPO TRAINING'),
    dc('div', { style: 'font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.6' },
      'Real training — actually updates Qwen3.8-27B\'s weights via GRPO — runs separately on a dedicated GPU pod (training/grpo/train_grpo.py), not from a button here, since it needs real GPU hardware this web app doesn\'t have. Once started there, it reports live progress back to this exact page automatically — any run below with the GRPO badge is a real, external job, not a simulation.')
  ));

  container.append(card(
    dc('div', { className: 'card-label' }, dc('span', { className: 'live-dot' }), 'RUNS'),
    state.trainingRuns.length === 0 ? dc('div', { style: 'color:var(--text3);font-size:10px' }, 'None yet.') :
    dc('div', {}, ...state.trainingRuns.map(t => {
      const pct = t.total_scenarios > 0 ? Math.round((t.completed_scenarios / t.total_scenarios) * 100) : 0;
      const isGrpo = t.run_type === 'grpo';
      return dc('div', {
        className: 'row-clickable', style: 'padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:10px',
        onClick: () => { state._runDetail = t.id; loadRunDetail(t.id); render(); },
      },
        dc('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
          dc('div', {}, t.status + ' — ' + t.completed_scenarios + '/' + t.total_scenarios + ' scenarios'),
          dc('span', { className: 'badge ' + (isGrpo ? 'badge-compiler' : 'badge-sem') }, isGrpo ? 'GRPO' : 'REFERENCE')
        ),
        dc('div', { className: 'progress-track' }, dc('div', { className: 'progress-fill', style: 'width:' + pct + '%' })),
        t.mean_reward != null && dc('div', { style: 'color:var(--text3)' }, 'mean reward: ' + t.mean_reward.toFixed(3))
      );
    }))
  ));

  if (state._runDetail && state._runDetailResults) {
    const results = state._runDetailResults;
    container.append(card(
      dc('div', { className: 'card-label' }, 'RUN DETAIL — REWARD PER SCENARIO'),
      results.length > 0 ? svgBarChart(results.map(r => r.reward), results.map((_, i) => i + 1)) : dc('div', { style: 'color:var(--text3);font-size:10px' }, 'No results yet — GRPO runs report aggregate reward progress, not per-scenario detail (see the mean reward on the run card above).'),
      results.length > 0 && dc('div', { style: 'margin-top:10px;max-height:300px;overflow-y:auto' },
        ...results.map(r => dc('div', { style: 'padding:6px;border-bottom:1px solid var(--border);font-size:9px' },
          'reward ' + r.reward + ' — proposed ' + JSON.stringify(r.proposed_structure) + ' vs true ' + JSON.stringify(r.hidden_intervention)))
      )
    ));
  }
  return container;
}
async function startTrainingRun() {
  state.busy = true; render();
  try {
    const run = await api('POST', '/api/training-runs', { use_case_ids: [] });
    state.trainingRuns = [run, ...state.trainingRuns];
  } catch (e) { alert(e.message); }
  state.busy = false; render();
}
async function loadTrainingRuns() { try { state.trainingRuns = await api('GET', '/api/training-runs'); render(); } catch (e) { console.error(e); } }
async function loadRunDetail(id) { try { state._runDetailResults = await api('GET', '/api/training-runs/' + id + '/results'); render(); } catch (e) { console.error(e); } }

// ── Compiler Jobs — full stage detail, live poll for in-progress jobs ─────
function renderCompiler() {
  if (!state._compilerPolling) {
    state._compilerPolling = true;
    startPolling(loadCompilerJobs, 4000);
  }
  const STAGES = ['ingestion', 'extraction', 'verification', 'abstraction', 'compilation', 'completed'];
  const container = dc('div', {});
  container.append(modHeader('SKILL COMPILATION', 'Compiler Jobs'));
  container.append(card(
    dc('div', { className: 'card-label' }, dc('span', { className: 'live-dot' }), 'JOBS'),
    state.compilerJobs.length === 0 ? dc('div', { style: 'color:var(--text3);font-size:10px;line-height:1.6' },
      'None yet. Go to the Demonstrations tab, upload a "log", "screen_recording", or "video" modality file (there\'s a sample log download button there), then click "Compile" on it — all three have real, working pipelines now.') :
    dc('div', {}, ...state.compilerJobs.map(j => {
      const expanded = state._expandedJob === j.id;
      return dc('div', {
        className: 'row-clickable', style: 'padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px',
        onClick: () => { state._expandedJob = expanded ? null : j.id; render(); },
      },
        dc('div', { className: 'stage-row' }, ...STAGES.map(s => dc('span', {
          className: 'stage-pill ' + (j.stage === 'failed' ? 'failed' : STAGES.indexOf(j.stage) > STAGES.indexOf(s) || j.stage === 'completed' ? 'done' : j.stage === s ? 'active' : '')
        }, s))),
        dc('div', { style: 'font-size:9px;color:var(--text3)' }, 'target: ' + j.target_output),
        j.error_message && dc('div', { style: 'font-size:9px;color:var(--red)' }, j.error_message),
        expanded && dc('div', { style: 'margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px' },
          j.observation_sequence && dc('div', {}, dc('div', { style: 'font-size:9px;color:var(--text3);margin-bottom:4px' }, 'OBSERVATION SEQUENCE'), dc('div', { className: 'detail-json' }, JSON.stringify(j.observation_sequence, null, 2))),
          j.causal_structure && dc('div', {}, dc('div', { style: 'font-size:9px;color:var(--text3);margin-bottom:4px' }, 'CAUSAL STRUCTURE'), dc('div', { className: 'detail-json' }, JSON.stringify(j.causal_structure, null, 2))),
          j.verified_structure && dc('div', {}, dc('div', { style: 'font-size:9px;color:var(--text3);margin-bottom:4px' }, 'VERIFIED STRUCTURE'), dc('div', { className: 'detail-json' }, JSON.stringify(j.verified_structure, null, 2))),
          j.abstracted_procedure && dc('div', {}, dc('div', { style: 'font-size:9px;color:var(--text3);margin-bottom:4px' }, 'ABSTRACTED PROCEDURE'), dc('div', { className: 'detail-json' }, JSON.stringify(j.abstracted_procedure, null, 2))),
          j.compiled_output && dc('div', {}, dc('div', { style: 'font-size:9px;color:var(--text3);margin-bottom:4px' }, 'COMPILED OUTPUT'), dc('div', { className: 'detail-json' }, JSON.stringify(j.compiled_output, null, 2))),
          j.confidence_notes && dc('div', { style: 'font-size:9px;color:var(--yellow)' }, j.confidence_notes),
          !j.observation_sequence && dc('div', { style: 'font-size:9px;color:var(--text3)' }, 'This job hasn\'t produced stage output yet — the pipeline stages are integration points ready for the real extraction/verification logic (see README).')
        )
      );
    }))
  ));
  return container;
}
async function loadCompilerJobs() { try { state.compilerJobs = await api('GET', '/api/compiler-jobs'); render(); } catch (e) { console.error(e); } }

// ── Checkpoints — wired to the real backend, not a stub ───────────────────
function renderCheckpoints() {
  if (state.checkpoints === null) { state.checkpoints = []; loadCheckpoints(); }
  const container = dc('div', {});
  container.append(modHeader('SEM MODEL REGISTRY', 'Checkpoints'));
  container.append(card(
    dc('div', { className: 'card-label' }, 'CHECKPOINTS'),
    state.checkpoints.length === 0
      ? dc('div', { style: 'color:var(--text3);font-size:10px' }, 'No checkpoints yet — a checkpoint is created once a training run produces a model worth registering.')
      : dc('div', {}, ...state.checkpoints.map(c => dc('div', { style: 'display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:10px' },
          dc('div', {},
            dc('div', {}, dc('b', {}, c.version), ' · ', c.base_model, c.is_active && dc('span', { className: 'badge badge-sem', style: 'margin-left:8px' }, 'ACTIVE')),
            c.mean_reward != null && dc('div', { style: 'color:var(--text3);margin-top:2px' }, 'mean reward: ' + c.mean_reward.toFixed(3))
          ),
          !c.is_active && btn('Activate', 'btn-cyan', () => activateCheckpoint(c.id))
        )))
  ));
  return container;
}
async function loadCheckpoints() { try { state.checkpoints = await api('GET', '/api/checkpoints'); render(); } catch (e) { console.error(e); } }
async function activateCheckpoint(id) {
  try { await api('POST', '/api/checkpoints/' + id + '/activate'); await loadCheckpoints(); } catch (e) { alert(e.message); }
}

render();
</script>
</body>
</html>
