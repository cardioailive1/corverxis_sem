<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SI-SEM Real Cases</title>
<link rel="icon" href="data:,">
<meta name="description" content="Contribute and review real, de-identified cases used to validate SI-SEM.">
<style>
:root{--bg:#f4f8fb;--surface:#fff;--ink:#0b2238;--ink2:#4a6378;--line:#d5e2ec;--brand:#0583a6;--brand-ink:#fff;--accent:#05d2fc;--ok:#157a45;--warn:#8a5a00;--warn-bg:#fff4d6;--bad:#b3261e;--chip:#eaf2f8;--chip-on:#0583a6;--shadow:0 1px 2px rgba(11,34,56,.06),0 4px 16px rgba(11,34,56,.06)}
:root[data-theme=dark]{--bg:#021830;--surface:#072544;--ink:#eaf4fb;--ink2:#9ab6cc;--line:#16466e;--brand:#05d2fc;--brand-ink:#021830;--ok:#4ade80;--warn:#fbbf24;--warn-bg:#3a2e0a;--bad:#f87171;--chip:#0d2f52;--chip-on:#05d2fc;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#021830;--surface:#072544;--ink:#eaf4fb;--ink2:#9ab6cc;--line:#16466e;--brand:#05d2fc;--brand-ink:#021830;--ok:#4ade80;--warn:#fbbf24;--warn-bg:#3a2e0a;--bad:#f87171;--chip:#0d2f52;--chip-on:#05d2fc;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header img{height:30px;border-radius:4px}
header h1{font-size:17px;margin:0;font-weight:650}
header .sp{flex:1}
header .btn{min-height:36px;padding:6px 14px}
.model{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
.model.live{color:var(--ok);border-color:var(--ok)}
main{max-width:880px;margin:0 auto;padding:20px 16px 64px}
h2{font-size:15px;margin:28px 0 10px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.cat{margin:18px 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted,#6b7280)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dom{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:block}
.dom:hover{border-color:var(--brand)}
.dom[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.dom b{display:block;font-size:15px}.dom span{color:var(--ink2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:14px;min-height:40px;display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--brand-ink);border-color:var(--chip-on);font-weight:600}
:where(button,input):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--brand);color:var(--brand-ink);font-weight:650;padding:11px 22px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.hint{color:var(--ink2);font-size:13px}
.answer{font-size:26px;font-weight:700;margin:4px 0 2px;word-break:break-word}
.badge{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.badge.sem{color:var(--ok);border-color:var(--ok)}.badge.fb{color:var(--warn);border-color:var(--warn)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:12px}
.err{color:var(--bad);margin-top:12px;font-size:14px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 48px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.bar i u{display:block;height:100%;background:var(--brand);text-decoration:none}
.bar.top span{font-weight:650}.bar em{font-style:normal;text-align:right;color:var(--ink2)}
.hist{list-style:none;margin:0;padding:0}.hist li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px;justify-content:space-between}
.hist li:first-child{border-top:0}
.gate{max-width:420px;margin:12vh auto 0}
input[type=password],input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:520px){.bar{grid-template-columns:1fr 1fr 44px}.answer{font-size:22px}}
.chatbox{display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:2px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--chip);border-bottom-left-radius:4px}
.msg small{display:block;margin-top:6px;color:var(--ink2);font-size:12px;white-space:normal}
.msg.bot.error{color:var(--bad)}
.compose{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-height:48px;max-height:140px;resize:vertical;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tiny{font-size:12px;color:var(--ink2)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.tab[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
label.f{display:block;margin:14px 0 4px;font-weight:600;font-size:14px}
select,input[type=text],input[type=email],textarea.t{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
textarea.t{min-height:90px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}.ck input{margin-top:4px;width:18px;height:18px}
.ok{color:var(--ok);margin-top:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.good{color:var(--ok);border-color:var(--ok)}
.case{border-top:1px solid var(--line);padding:12px 0}.case:first-child{border-top:0}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <img src="assets/corverxis_logo.jpg" alt="Corverxis">
  <h1>SI-SEM Real Cases</h1><span class="sp"></span>
  <span id="who" class="model" hidden></span>
  <button class="btn ghost" id="signout" hidden>Sign out</button>
</header>
<main id="app"></main>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var API=(window.SEM_API_BASE||'').replace(/\/$/,'')+'/api/collect';
var S={key:null,me:null,domains:[],tab:'submit',domain:'',signals:{},msg:null,err:null,mine:[],queue:[],progress:[],contribs:[],newKey:null,busy:false};
function store(op,k,v){try{if(op==='get')return localStorage.getItem(k);if(op==='set')localStorage.setItem(k,v);if(op==='del')localStorage.removeItem(k)}catch(e){}return null}
function el(tag,a,kids){var e=document.createElement(tag);a=a||{};for(var k in a){if(k==='text')e.textContent=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]===true?'':a[k])}
  (function add(x){if(x==null)return;if(Array.isArray(x))x.forEach(add);else e.append(x.nodeType?x:document.createTextNode(String(x)))})(kids);return e}
var $=function(s){return document.querySelector(s)};
var human=function(s){return String(s).replace(/_/g,' ')};
function call(path,body){var h={'x-api-key':S.key};if(body)h['content-type']='application/json';
  return fetch(API+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){if(r.status===401){signOut(true);throw new Error('That access key was not accepted.')}
      if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j})})}
function signOut(bad){store('del','sc_key');S.key=null;S.me=null;S.err=bad?'That access key was not accepted.':null;render()}
$('#signout').addEventListener('click',function(){signOut(false)});

function gate(){var m=$('#app');m.textContent='';var inp=el('input',{type:'password',id:'k',autocomplete:'off',placeholder:'Access key','aria-label':'Access key'});
  function go(){var k=inp.value.trim();if(!k)return;S.key=k;S.err=null;boot(true)}
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  m.append(el('div',{class:'gate card'},[el('h2',{style:'margin-top:0',text:'Sign in'}),
    el('p',{class:'hint',text:'Use the access key you were given. Contributors submit and review real, de-identified cases. Admins manage people and see progress.'}),inp,
    el('div',{class:'row'},el('button',{class:'btn',text:'Continue',onclick:go})),S.err?el('div',{class:'err',role:'alert',text:S.err}):null]));inp.focus()}

function boot(save){return Promise.all([call('/me'),call('/domains')]).then(function(r){S.me=r[0];S.domains=r[1];if(save)store('set','sc_key',S.key);
  S.tab=S.me.role==='admin'?'admin':'submit';return load().then(render)}).catch(function(e){S.err=e.message;if(!S.me)gate()})}

function tabs(){var t=[];if(S.me.role==='contributor')t.push(['submit','Submit a case'],['mine','My cases'],['review','Review']);else t.push(['admin','Progress'],['people','People']);
  return el('div',{class:'tabs',role:'tablist'},t.map(function(x){return el('button',{class:'btn ghost tab',type:'button',role:'tab','aria-pressed':String(S.tab===x[0]),text:x[1],onclick:function(){S.tab=x[0];S.msg=S.err=null;load().then(render)}})}))}
function load(){if(S.tab==='mine')return call('/cases/mine').then(function(r){S.mine=r});
  if(S.tab==='review')return call('/review/queue').then(function(r){S.queue=r});
  if(S.tab==='admin')return call('/progress').then(function(r){S.progress=r});
  if(S.tab==='people')return call('/contributors').then(function(r){S.contribs=r});return Promise.resolve()}
function flash(){return [S.msg?el('div',{class:'ok',role:'status',text:S.msg}):null,S.err?el('div',{class:'err',role:'alert',text:S.err}):null]}

function submitView(){var d=S.domains.filter(function(x){return x.slug===S.domain})[0];var box=el('div',{});
  var sel=el('select',{id:'dom','aria-label':'Domain',onchange:function(e){S.domain=e.target.value;S.signals={};render()}},[el('option',{value:'',text:'Choose a domain'})].concat(S.domains.map(function(x){return el('option',{value:x.slug,text:x.name,selected:x.slug===S.domain})})));
  box.append(el('div',{class:'card'},[el('p',{class:'hint',style:'margin-top:0',text:'Enter one real case where the cause was confirmed. Remove names, IDs and anything that could identify a person or organisation. Cases are reviewed by a second qualified person before they are used.'}),el('label',{class:'f',for:'dom',text:'Domain'}),sel]));
  if(!d)return box;
  var f=el('div',{class:'card',style:'margin-top:16px'});
  if(d.caution)f.append(el('div',{class:'note',text:d.caution}));
  f.append(el('label',{class:'f',text:'Which of these were present? Leave a signal unticked only if you checked and it was absent.'}));
  f.append(el('div',{class:'chips'},d.signals.map(function(s){return el('button',{class:'chip',type:'button','aria-pressed':String(!!S.signals[s]),text:human(s),onclick:function(){S.signals[s]=!S.signals[s];this.setAttribute('aria-pressed',String(!!S.signals[s]))}})})));
  var cause=el('select',{id:'cause'},[el('option',{value:'',text:'Choose the confirmed cause'})].concat(d.causes.map(function(c){return el('option',{value:c,text:human(c)})})).concat([el('option',{value:'other_not_listed',text:'Other (not in this list)'})]));
  var other=el('input',{type:'text',id:'other',placeholder:'Describe the cause (only if Other)',maxlength:'200'});
  var kind=el('select',{id:'kind'},[['confirmed_outcome','Confirmed by the outcome'],['test_or_inspection','Confirmed by a test or inspection'],['post_mortem','Post-mortem or formal review'],['expert_judgement','Expert judgement only']].map(function(x){return el('option',{value:x[0],text:x[1]})}));
  var ev=el('textarea',{class:'t',id:'ev',maxlength:'2000',placeholder:'How was the cause confirmed? Do not include names, IDs, emails or phone numbers.'});
  var src=el('input',{type:'text',id:'src',maxlength:'200',placeholder:'Optional: de-identified source, e.g. "Registry A"'});
  var when=el('input',{type:'text',id:'when',placeholder:'Optional: YYYY-MM',maxlength:'10'});
  var c1=el('input',{type:'checkbox',id:'c1'}),c2=el('input',{type:'checkbox',id:'c2'});
  f.append(el('label',{class:'f',for:'cause',text:'Confirmed cause'}),cause,el('label',{class:'f',for:'other',text:'If Other'}),other,
    el('label',{class:'f',for:'kind',text:'How it was confirmed'}),kind,el('label',{class:'f',for:'ev',text:'Evidence'}),ev,
    el('label',{class:'f',for:'src',text:'Source'}),src,el('label',{class:'f',for:'when',text:'When it happened'}),when,
    el('label',{class:'ck'},[c1,el('span',{text:'I checked every listed signal. Unticked ones were absent.'})]),
    el('label',{class:'ck'},[c2,el('span',{text:'This case contains no personal or confidential identifiers.'})]));
  var btn=el('button',{class:'btn',type:'button',text:'Submit case',onclick:function(){
    var sig=d.signals.filter(function(s){return S.signals[s]});S.msg=S.err=null;btn.disabled=true;
    call('/cases',{domain:d.slug,signals:sig,trueCause:cause.value,otherCause:other.value||undefined,evidenceKind:kind.value,evidence:ev.value,source:src.value||undefined,occurredOn:when.value||undefined,checkedAllSignals:c1.checked,deidentified:c2.checked})
    .then(function(){S.msg='Submitted. A second person will review it.';S.signals={};S.domain=d.slug;render()}).catch(function(e){S.err=e.message;btn.disabled=false;var m=f.querySelector('.err');if(m)m.remove();f.append(el('div',{class:'err',role:'alert',text:e.message}))})}});
  f.append(el('div',{class:'row'},btn));box.append(f);return box}

function caseCard(c,actions){return el('div',{class:'case'},[el('div',{},[el('b',{text:human(c.domain)}),' ',el('span',{class:'pill',text:human(c.review_status)}),' ',c.origin&&c.origin!=='manual'?el('span',{class:'pill',text:c.origin==='ingest'?'pushed by '+(c.ingest_source||'a system'):human(c.origin)}):null]),
  el('div',{class:'hint',text:'Signals: '+(c.signals.length?c.signals.map(human).join(', '):'none')}),
  el('div',{text:'Confirmed cause: '+human(c.true_cause)+(c.other_cause?' ('+c.other_cause+')':'')}),
  el('div',{class:'hint',text:human(c.evidence_kind)+(c.source?' · '+c.source:'')+(c.occurred_on?' · '+c.occurred_on:'')}),el('div',{style:'margin-top:6px;white-space:pre-wrap',text:c.evidence}),
  c.screen&&c.screen.flagged?el('div',{class:'note',text:'Automatic pre-screen flagged this: '+(c.screen.reasons.length?c.screen.reasons.join(' '):'low consistency')+' A person decides.'}):null,
  c.review_notes?el('div',{class:'note',text:'Reviewer: '+c.review_notes}):null,actions||null])}
function mineView(){return el('div',{class:'card'},S.mine.length?S.mine.map(function(c){return caseCard(c)}):el('p',{class:'hint',text:'You have not submitted any cases yet.'}))}
function reviewView(){var box=el('div',{class:'card'});if(!S.queue.length){box.append(el('p',{class:'hint',text:'Nothing is waiting for you. Cases you submitted yourself never appear here.'}));return box}
  S.queue.forEach(function(c){var notes=el('input',{type:'text',placeholder:'Notes (required unless approving)','aria-label':'Review notes'});
    function act(dec){S.msg=S.err=null;call('/cases/'+c.id+'/review',{decision:dec,notes:notes.value}).then(function(){S.msg='Saved.';return load()}).then(render).catch(function(e){S.err=e.message;render()})}
    box.append(caseCard(c,el('div',{},[notes,el('div',{class:'row'},[el('button',{class:'btn',type:'button',text:'Approve',onclick:function(){act('approved')}}),el('button',{class:'btn ghost',type:'button',text:'Needs revision',onclick:function(){act('needs_revision')}}),el('button',{class:'btn ghost',type:'button',text:'Reject',onclick:function(){act('rejected')}})])])))});return box}

function progressView(){var rows=S.progress.map(function(p){return el('tr',{},[el('td',{text:p.name}),el('td',{text:p.approved+' / '+p.needed_overall}),el('td',{text:p.causes_present+' / '+p.causes_total}),el('td',{text:String(p.awaiting_review)}),el('td',{text:p.user_reports?p.user_reports+' ('+Math.round(p.user_report_agreement*100)+'%)':'-'}),
    el('td',{},p.ready_to_calibrate?el('span',{class:'pill good',text:'ready'}):el('span',{class:'pill',text:'collecting'})),
    el('td',{},el('button',{class:'btn ghost',type:'button',style:'min-height:32px;padding:4px 10px',text:'Export CSV',onclick:function(){exportCsv(p.slug)}}))])});
  var scr=el('button',{class:'btn ghost',type:'button',text:'Run automatic screening now',onclick:function(){scr.disabled=true;S.msg=S.err=null;call('/screen',{}).then(function(r){S.msg='Screened '+r.screened+' cases, '+r.flagged+' flagged.';return load()}).then(render).catch(function(e){S.err=e.message;render()})}});
  return el('div',{class:'card'},[el('div',{class:'row',style:'margin:0 0 12px'},scr),el('p',{class:'hint',style:'margin-top:0',text:'A domain is ready to calibrate when every cause has about 22 approved cases and the total reaches 20 per cause. Then run calibrate.py on the exported CSV.'}),
    el('div',{class:'scroll'},el('table',{},[el('thead',{},el('tr',{},['Domain','Approved / needed','Causes seen','Awaiting review','User reports (agree)','Status',''].map(function(h){return el('th',{text:h})}))),el('tbody',{},rows)]))])}
function exportCsv(slug){fetch(API+'/export/'+slug+'.csv',{headers:{'x-api-key':S.key}}).then(function(r){if(!r.ok)throw new Error('Export failed');return r.blob()}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=slug+'-cases.csv';document.body.append(a);a.click();a.remove()}).catch(function(e){S.err=e.message;render()})}

function peopleView(){var name=el('input',{type:'text',placeholder:'Name','aria-label':'Name'}),email=el('input',{type:'email',placeholder:'Email','aria-label':'Email'});
  var sel=el('select',{multiple:true,size:'6','aria-label':'Qualified domains'},S.domains.map(function(d){return el('option',{value:d.slug,text:d.name})}));var notes=el('input',{type:'text',placeholder:'How were they qualified? (role, credentials)','aria-label':'Qualification notes'});
  var f=el('div',{class:'card'},[el('h2',{style:'margin-top:0',text:'Add a contributor'}),name,el('div',{style:'height:8px'}),email,el('div',{style:'height:8px'}),el('div',{class:'hint',text:'Qualified domains (Ctrl or Cmd to pick several)'}),sel,el('div',{style:'height:8px'}),notes,
    el('div',{class:'row'},el('button',{class:'btn',type:'button',text:'Create and show key',onclick:function(){S.err=S.msg=null;
      call('/contributors',{name:name.value,email:email.value,domains:[].slice.call(sel.selectedOptions).map(function(o){return o.value}),notes:notes.value}).then(function(r){S.newKey=r;return load()}).then(render).catch(function(e){S.err=e.message;render()})}}))]);
  var k=S.newKey?el('div',{class:'card',style:'margin-top:16px'},[el('b',{text:'Access key for '+S.newKey.name}),el('p',{class:'hint',text:'Copy it now. It is not stored and cannot be shown again.'}),el('code',{style:'word-break:break-all;user-select:all',text:S.newKey.access_key})]):null;
  var list=el('div',{class:'card',style:'margin-top:16px'},S.contribs.length?S.contribs.map(function(c){return el('div',{class:'case'},[el('b',{text:c.name}),' ',el('span',{class:'pill',text:c.status}),el('div',{class:'hint',text:c.email+' · '+c.domains.map(human).join(', ')}),
    el('button',{class:'btn ghost',type:'button',style:'min-height:32px;padding:4px 10px;margin-top:6px',text:c.status==='qualified'?'Suspend':'Reinstate',onclick:function(){call('/contributors/'+c.id+'/status',{status:c.status==='qualified'?'suspended':'qualified'}).then(load).then(render).catch(function(e){S.err=e.message;render()})}})])}):el('p',{class:'hint',text:'No contributors yet.'}));
  return el('div',{},[f,k,list])}

function render(){var who=$('#who'),so=$('#signout');if(!S.key||!S.me){who.hidden=so.hidden=true;return gate()}
  who.hidden=so.hidden=false;who.textContent=S.me.name+' ('+S.me.role+')';var m=$('#app');m.textContent='';
  var v={submit:submitView,mine:mineView,review:reviewView,admin:progressView,people:peopleView}[S.tab];m.append(tabs(),el('div',{},flash()),v())}

var saved=store('get','sc_key');if(saved){S.key=saved;boot(false)}else render();
})();
</script>
</body>
</html>
